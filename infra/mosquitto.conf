# infra/mosquitto.conf
# Mosquitto MQTT Broker Configuration
# Development: plain MQTT on 1883 (LAN-only)
# Production: add TLS listener on 8883 with certs

# ── Plain listener (development / LAN) ───────────────────────────────────────
listener 1883 0.0.0.0
allow_anonymous true          # Change to false and add password_file in prod

# ── WebSocket listener (optional — for browser-based sensor simulators) ──────
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# ── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ── QoS and message limits ────────────────────────────────────────────────────
max_inflight_messages 100
max_queued_messages   1000
message_size_limit    65536   # 64 KB max payload (well above our wire structs)

# ── Keepalive ────────────────────────────────────────────────────────────────
keepalive_interval 60
