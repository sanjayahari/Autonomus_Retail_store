# infra/nginx.conf
# Nginx configuration for the production dashboard container.
# Serves the Vite build output and proxies /api and /ws to cloud-api.

server {
    listen 80;
    server_name _;

    # Serve built React assets
    root   /usr/share/nginx/html;
    index  index.html;

    # Aggressive caching for hashed assets (Vite content-hashes filenames)
    location ~* \.(js|css|png|jpg|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API calls to cloud-api service
    location /api/ {
        proxy_pass         http://cloud-api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy WebSocket upgrade to cloud-api
    location / {
        proxy_pass         http://cloud-api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # Keep WebSocket alive for 1 hour
    }

    # Security headers
    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;
    add_header Permissions-Policy     "camera=(), microphone=()";

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
}
