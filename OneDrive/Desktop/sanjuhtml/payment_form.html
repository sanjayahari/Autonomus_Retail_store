<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paymemt Form</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
<div class="container">
<header>
<h1 >Payment Form </h1>
</header>
<form action="#" method="post">
    <p>Welcome to the Payment Form</p>
    <p>Please fill in the details below to complete your payment.</p>
    <div class="navbar">

    <nav class="nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
    </nav>
    </div>
<section>
    <p>Name:
            <input type="text"  id="name" placeholder="Enter your name" required></p>
               <fieldset class="gender"><legend>Gender</legend>
                     Male<input type="radio" class="male"name="gender" >Female<input type="radio" class="female" name="gender"  > 
     
    
               </fieldset>
    <p>Address:
   <textarea  type="text" placeholder="Enter your address" cols="40"  rows="10"></textarea> 
                   </p>


    <p >Email:
             <input type="email"  class="email" placeholder="Enter your email" required></p>

    <p class="heading">Payment Method</p>
</section>

<div class="section-container">

</div>
<section class="section2" >  
        <select name="payment_method" id="payment_method" required>
                <option value="credit_card">Credit Card</option>
                <option value="debit_card">Debit Card</option>
                <option value="paypal">PayPal</option>
                <option value="bank_transfer">Bank Transfer</option>
        </select>
    

        <p>Card Type:
        
        <select name="card_type" id="card_type" required>
        <option value="visa"></option>
        <option value="mastercard">MasterCard</option>
        <option value="american_express">American Express</option>
        <option value="discover">Discover</option>
        <option value="jcb">JCB</option>
        </select>
        </p>
        <p >Card Number:<input type="text" class="card" placeholder="Enter your card number" required></p>

             <label for="expiry">Expiry Date:</label>
             <input type="month" id="expiry"  name="expiry" required>

        <p >CVV:<input type="password" id="cvv" placeholder="Enter your CVV" required ></p> 
</section>
<section class="section3">
        <p>Amount:
             <input type="number" placeholder="Enter amount" required></p>

        </p>
   <div class="checkbox">
        <p><input type="submit" value="Pay Now"></p>
   </div>
</section>
</div>
<footer>
    <p>&copy; 2023 Payment Form. All rights reserved.</p>
</body>
</html>
