<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style3.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #D2D2D2;
            background-image:
            repeating-linear-gradient(
                to right, transparent 0 100px,
                #25283b22 100px 101px
            ),
            repeating-linear-gradient(
                to bottom, transparent 0 100px,
                #25283b22 100px 101px
            );
        }
        body::before{
            position: absolute;
            width: min(1400px, 90vw);
            /* Adjust the width to fit your design */
            top: 10%;
            /* Adjust the top position to fit your design */
            left: 50%;
            /* Center the background */

            height: 90%;
            /* Adjust the height to fit your design */
            transform: translateX(-50%);
            /* Center the background */
            /* Adjust the transform to center the background */
            
            content: '';
            /* Use an empty content to create the pseudo-element */
            background-image: url(images/bg.png);
            /* Replace with your background image */

            background-size: 100%;
            /* Adjust the background size to fit your design */
            background-repeat: no-repeat;
            background-position: top center;
            /* Adjust the background position to fit your design */
            pointer-events: none;
            /* Prevent interaction with the pseudo-element */
        }

    </style>
</head>
<body>
    <div class="banner">
        <div class="slider" style="--quantity: 8">

            <div class="item" style="--position: 4"><img src="donghua2.jpg" alt=""></div>
            <div class="item" style="--position: 5"><img src="donghua3.jpg" alt=""></div>
            <div class="item" style="--position: 6"><img src="dragon_8.jpg" alt=""></div>
            <div class="item" style="--position: 7"><img src="donghua5.jpeg" alt=""></div>
            <div class="item" style="--position: 8"><img src="dragon_9.jpg" alt=""></div>
        </div>
        <div class="content">
            <h1 data-content="CSS ONLY">
                CSS ONLY
            </h1>
            <div class="author">
                <h2>SANJAY AHARI</h2>
                <p><b> Web Design</b></p>
                <p>I am a web designer and developer with a passion for creating beautiful and functional websites. I love to explore new technologies and push the boundaries of web design.</p>
