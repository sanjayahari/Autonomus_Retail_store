<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        body{
            background-color:#f0f0efd3;
            column-rule-color: #aebd00d3;
            font-family: cursive, Geneva, Tahoma, sans-serif;   
        }
        h1{
            color : #0d0d0e;
            text-align: center;
            font-size: 2.5em;
            text-decoration: underline;
            text-transform: calc(uppercase);
            font-variant-emoji: small-caps;
        }
        .container{
            background-color: #d3d3d3;
            
            padding: 10px;
            border: 5px solid #232020;
            border-radius: 10px;
            box-shadow: 40px 40px 5pt rgba(51, 50, 50, 0.2);
            text-align: center;
            margin :20px  auto ;
            width : 40%;
           

            
        }
        p{ 
            color:#0e0e0dd3;
            font-size: xx-large;
            font-weight: bold;
            line-height: 2;
        
            background-color: #a5c869;
            color: white;
            padding: 10px 20px;
           
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        #span{
        
            color: #0d0d0e;
            font-weight: 600;
            font-size: 1.2em;
        }
        table{
            border-collapse: collapse;
            width: 40%;
            
            margin: 100px  auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            
        }
        th, td{
            padding: 10px;
            text-align: left;
            border-bottom: 5px solid #698dc8;
            border-radius: 10px;
            border-left: 2px solid #1b2027;
            border-right: 2px solid #1b2027;

        }
        th{
            background-color: #a5c869;
            color: white;
            font-weight: bold;
        }
        p::after {
            
            content: " - CSS is fun!";
            color: #48489f;
            font-style: italic;
        }
        p:hover {
            background-color: #d3d3d3;
            color: #0c0c0f;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        p:hover::after {
            content: " - Let's style it!";
            color: #48489f;
            font-style: italic;
        }
        #me {
            background-color: #39bdd4;
            color: #e38080;
            
            width:100px;
            height: 50px;
            border-radius:50px 50px 0 0;
            position: relative;
            top:20px;
            margin:auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
       
        #n{
            color: #e38080;
            font-weight: bold;
            font-size: 1.2em;
            text-align:  center;
               
            
            display: block;}
        #options {
            width: 100px;
            height: 40px;
            border-radius: 5px;
            border: 2px solid #151617;
            background-color: #f2f5ef;
            color: rgb(11, 11, 11);
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            padding: 2px;
            margin: 20px auto;
            display: block;
        }
        #avatar {
            text-align: center;
            padding: 200px;
            margin: 20px auto;
            
            background-repeat: none;
        }

        </style>
</head>
<body>
    <div id="me">  <em id="n">Sanju</em> </div>
    <div id="avatar">
        <img src="https://cdn.pixabay.com/photo/2017/08/30/01/01/avatar-2695569_1280.png" alt="Avatar" style="width:100px;height:100px;border-radius:50%;">
    </div>
    <h1>THE KNIGHT KING</h1>
    <div class="container">
        

    <p>Hey,are you ready to play with CSS <span id="span"> then dont delay dallying</span> , <em>I look forward for that</em></p>
    </div>

       
   

    <table>
        
        <tr>
        <th>NAME</th>
        <th>class</th>
        <th>Section</th>
        </tr>
        <tr>
        <div class="container">Perfect  To Study

        <td >sanjay ahari</td>
        <td >10</td>

        <td >B</td>
        </div>

        </tr>
        


        
        
    </table>
    <input type="text" placeholder="select your option">
     <select name="options" id="options" >
            <option value="select">select</option>
            <option value="css">css</option>
            <option value="html">html</option>
            <option value="javascript">js</option>
            <option value="python">python</option>
            <option value="java">java</option>
            <option value="c++">c++</option></select>

</body>
</html>
