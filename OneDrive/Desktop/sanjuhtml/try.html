<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        
       .banner{
           width:100%;
           height:100vh;
           text-align: center;
           position:relative;
           
           
       }
       .banner .slider{
             
             position:absolute;
              width: 200px;
              height: 250px;
              top:10%;
              left: 50%;
              transform-style: preserve-3d;
              transform: perspective(1000px);
              animation: autorun 20s linear infinite;
              z-index: 2;
        
}
@keyframes autorun {
    from { transform: perspective(1000px)  rotateY(0deg); 

    }to{ transform: perspective(1000px)  rotateY(360deg);
         }
}
.banner .slider .item {
    position: absolute;
    
    transform: 
        rotateY(calc( (var(--position) - 1) * ( 360/ var(--quantity)) * 1deg)) 
        translateZ(550px);
}
.banner .slider .item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    
}


        
        </style>
</head>
<body>
    <div class="banner">
        <div class="slider"   style=" --quantity: 3" >
            <div class="item" style="--position: 1">
                <img src="donghua1.jpeg" alt="Image 1">
            </div>
            <div class="item" style="--position: 2">
                <img src="donghua2.jpg" alt="Image 2">
            </div>
            <div class="item" style="--position: 3">
                <img src="donghua3.jpg" alt="Image 3">
            </div>
        </div>
    </div>
    <div>
        <h1 data-content="CSS ONLY">
            CSS ONLY
        </h1>
    </div>
    
</body>
</html>
