<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #0a0a2a;
            color: white;
            font-family: 'montserat','cursive', 'sans-serif';
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
            
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index:-1;
            pointer-events: none;
           
        }
        .star{
            position:fixed;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease;
            opacity: var(--opacity);

        }
        @keyframes twinkle {
            0%, 100% { opacity: var(--opacity); transform: scale(2); }
            50% { opacity: var(--opacity-half); transform: scale(0.8); }
        }
        
    
        

    </style>

</head>
<body>
  

    
   <div class="stars" id="stars">
        <!-- Stars will be generated here -->

    </div>
    
    <script>
        // Create twinkling stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 2000;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random position
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                // Random size
                const size = Math.random() * 3;
                
                // Random opacity
                const opacity = Math.random() * 0.7 + 0.3;
                
                // Random animation duration
                const duration = Math.random() * 3 + 2;
                
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.setProperty('--opacity', opacity);
                star.style.setProperty('--opacity-half', opacity / 2);
                star.style.setProperty('--duration', `${duration}s`);
                
                starsContainer.appendChild(star);
            }
        }
    // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            
        });
    </script>
        
    
</body>
</html>
